<style>
@font-face{font-family:'Cubic 11';src:url('assets/15a6461dd501.woff2') format('woff2');font-display:swap}
/* Layout: one cozy column (max 800px) on a warm paper wallpaper; rounded cream panels with brown outlines, wooden sign for the title.
   HUD stays on top, one screen at a time below. Single bold move: the hanging wooden title sign. Everything else stays soft and quiet. */
:root{
  --bg:#1c1726; --paper:#1c1726; --panel:#2c2438; --line:#b08a5a; --fg:#f3e6c8; --muted:#b9a88f;
  --accent:#f2b24c; --accent-d:#e8955a; --red:#e8735c; --green:#b2b78f; --blue:#71a8eb; --pink:#fbb596; --sky:#2a2235; --hi:#4a3a5c;
  --good:#6b8e36; --bad:#a65639; --wood:#4a3a5c;
  --font:'Cubic 11','Huninn','Hiragino Maru Gothic ProN','Zen Maru Gothic','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:20px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.deco{display:none!important;position:fixed;bottom:0;width:150px;height:150px;pointer-events:none;z-index:0;opacity:.9}
.deco.l{left:0}.deco.r{right:0}
@media (max-width:900px){.deco{display:none}}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;font-weight:400}
canvas{image-rendering:auto}
:focus-visible{outline:4px dotted var(--blue);outline-offset:3px}

.px{background:var(--panel);border:3px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 5px 0 rgba(8,6,12,.28)}
.btn{font:inherit;color:var(--fg);background:#2c2438;border:3px solid var(--line);border-radius:18px;cursor:pointer;padding:10px 14px;min-height:48px;text-align:left;line-height:1.4;box-shadow:0 4px 0 rgba(8,6,12,.35)}
.btn:hover:not(:disabled){background:var(--hi)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(8,6,12,.35)}
.btn:disabled{opacity:.45;cursor:not-allowed;background:#2a2235}
.btn small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.talisman{font:inherit;cursor:pointer;background:var(--accent);color:var(--fg);border:3px solid var(--line);border-radius:999px;font-size:24px;letter-spacing:.1em;padding:12px 30px;min-height:56px;box-shadow:0 6px 0 var(--accent-d)}
.talisman:hover:not(:disabled){background:#f2b24c}
.talisman:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--accent-d)}
.talisman:disabled{opacity:.45;cursor:not-allowed}
.talisman.big{font-size:30px;min-height:70px;padding:12px 40px}
.talisman.small{font-size:16px;min-height:38px;padding:2px 16px;box-shadow:0 3px 0 var(--accent-d)}
.lbl{font-size:14px;color:var(--muted);letter-spacing:.06em}
.tag{display:inline-block;background:var(--sky);border:2px solid var(--line);color:var(--fg);font-size:14px;padding:0 12px;border-radius:999px}

.hud{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-bottom:22px;padding:10px 16px}
.hud canvas{width:64px;height:48px;display:block;background:var(--sky);border:3px solid var(--line);border-radius:16px}
.hud-bars{display:grid;gap:6px;min-width:0}
.vital{display:grid;grid-template-columns:3.2em 1fr 2.4em;gap:8px;align-items:center;font-size:15px}
.vital .vv{font-size:14px;text-align:right}
.bar{height:16px;background:#2c2438;border:3px solid var(--line);border-radius:999px;position:relative;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--c);border-radius:999px;transition:width .4s}
.bar.blood{--c:var(--red)} .bar.mind{--c:var(--blue)}
.hud-money{text-align:right}
.hud-money b{display:block;font-weight:400;font-size:20px;color:var(--good);margin-top:2px}

.screen{max-width:760px;margin:0 auto}
.screen h2{font-size:26px;line-height:1.35}

.title-hero{text-align:center;display:grid;gap:18px;justify-items:center;padding:26px 16px 30px}
.sign{position:relative;margin-top:26px;padding:16px 34px 12px;background:var(--wood);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 rgba(8,6,12,.3)}
.sign::before,.sign::after{content:"";position:absolute;top:-30px;width:5px;height:30px;background:#0e0b14;border-radius:3px}
.sign::before{left:26%}.sign::after{right:26%}
.sign h1{font-family:'Chiron GoRound TC',var(--font,inherit),sans-serif;font-weight:900;font-size:clamp(34px,9vw,56px);line-height:1.18;color:var(--fg);letter-spacing:.05em}
.sign h1 b{font-weight:900;color:var(--red)}
.sign h1 span{color:var(--good)}
.title-hero .sub{max-width:28em;background:var(--paper);border:3px solid var(--line);border-radius:22px;padding:8px 20px}
.hero-box{background:var(--sky);border:3px solid var(--line);border-radius:26px;padding:16px 28px;display:grid;justify-items:center;align-items:center;gap:0}
.hero-box canvas{width:240px;height:224px;max-width:100%;display:block}
@media (max-height:760px){.hero-box canvas{width:190px;height:178px}}
.hero-box .stage-name{display:none;font-size:16px;color:var(--good);min-height:1.5em}
.looks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lookbtn{font:inherit;color:var(--fg);cursor:pointer;background:var(--paper);border:3px solid var(--line);border-radius:20px;padding:6px 10px 4px;display:grid;justify-items:center;gap:2px;min-width:92px}
.lookbtn canvas{width:72px;height:84px;display:block}
.lookbtn:hover{background:var(--hi)}
.lookbtn[aria-checked="true"]{background:var(--accent);box-shadow:0 4px 0 rgba(8,6,12,.45)}
.name-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;background:var(--paper);border:3px solid var(--line);border-radius:999px;padding:8px 18px}
.name-row input{font:inherit;font-size:20px;width:9em;max-width:100%;padding:4px 14px;border:3px solid var(--line);border-radius:999px;background:#2c2438;color:#f3e6c8;-webkit-text-fill-color:#f3e6c8;opacity:1;text-align:center}
.howto{text-align:left;max-width:30em;color:var(--muted);font-size:16px;padding-left:1.2em;margin:0}
p.howto{padding-left:0}

.cast{display:flex;justify-content:space-between;align-items:center;background:var(--sky);border:3px solid var(--line);border-radius:26px;padding:12px 22px 0;margin-bottom:-3px;position:relative;min-height:190px;overflow:hidden;box-shadow:0 5px 0 rgba(8,6,12,.28)}
.cast .place{position:absolute;top:10px;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
.cast canvas{width:165px;height:165px;display:block;transition:transform .15s}
.cast canvas.dim{opacity:.6}
.cast canvas.talk{transform:translateY(-6px)}
.dlg{margin-top:14px;min-height:170px;display:grid;gap:10px;align-content:start}
.nametag{display:inline-block;justify-self:start;background:var(--accent);border:2px solid var(--line);padding:0 14px;font-size:16px;border-radius:999px}
.dlg-text{font-size:20px;line-height:1.7;min-height:3.6em}
.dlg-text.narr{color:var(--muted)}
.dlg-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.choices{display:grid;gap:10px}

.cut{display:grid;gap:12px;justify-items:center}
.cut canvas{width:100%;max-width:640px;aspect-ratio:3/2;display:block;border:3px solid var(--line);border-radius:26px;background:var(--sky)}
/* 目前只用一個主角：隱藏標題畫面的造型選擇。要恢復三種造型，刪掉下面這行 */
.looks{display:none!important}
#svbox{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));display:flex;gap:8px}
#svbox button{font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:6px 16px;min-height:40px;cursor:pointer;box-shadow:0 4px 0 rgba(8,6,12,.35)}
#svbox #svb{background:#f2b24c}
#svbox.idle #svb{opacity:.45;cursor:default}
#svbox.pulse #svb{animation:svp 1.1s ease-in-out infinite}
@keyframes svp{50%{transform:translateY(-3px);box-shadow:0 7px 0 rgba(8,6,12,.35)}}
#rst[data-arm]{background:#e8735c;color:#2c2438}
.remind{color:#a65639;font-size:18px;margin:6px 0}
.cut .cutvid{width:100%;max-width:420px;max-height:78vh;aspect-ratio:9/16;display:block;border:3px solid var(--line);border-radius:26px;background:#241413;object-fit:cover}
.cut .cap{font-size:20px;min-height:1.7em;text-align:center}

.game-head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-bottom:14px}
.task{font-size:20px;margin-bottom:4px}
.rule{color:var(--muted);font-size:16px;margin-bottom:14px}
.game-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:18px}
.shake{animation:shake .32s steps(4)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:1.7em;font-size:17px;margin-top:10px}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}

.folders{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.folder{text-align:center;padding:12px 8px;background:#3d3150}
.folder:nth-child(2){background:var(--hi)} .folder:nth-child(3){background:#3d3150}
.folder b{display:block;font-size:18px;font-weight:400}
.folder .cnt{font-size:14px;color:var(--fg)}
.clips{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.clip{text-align:center;padding:8px 8px 10px;display:grid;gap:6px;justify-items:center}
.clip canvas{width:100%;aspect-ratio:3/2;display:block;border:2px solid var(--line);border-radius:12px;background:#2c2438}
.clip{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.clip.lifted{opacity:.35}
.clip.ghost{position:fixed;z-index:60;pointer-events:none;transform:rotate(-4deg) scale(1.05);box-shadow:0 10px 0 rgba(8,6,12,.25);opacity:.95;margin:0}
.folder.over{background:var(--hi);transform:translateY(-3px) scale(1.03)}
.clip.sel{background:var(--hi);transform:translateY(-3px) rotate(-1.2deg)}

.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.shot{padding:6px;text-align:center;background:#2c2438;border:3px solid var(--line);border-radius:18px;cursor:pointer;color:var(--fg);font:inherit;box-shadow:0 4px 0 rgba(8,6,12,.35)}
.shot .view{display:block;overflow:hidden;background:#241413;aspect-ratio:3/2;border-radius:12px}
.shot canvas{width:100%;height:100%;display:block}
.shot.fx-shaky canvas{animation:jit .18s steps(2) infinite}
@keyframes jit{0%{transform:translate(2px,-2px)}50%{transform:translate(-3px,2px)}100%{transform:translate(2px,1px)}}
.shot.fx-dark canvas{filter:brightness(.3)}
.shot.fx-blur canvas{filter:blur(2.5px)}
.shot.fx-tilt canvas{transform:rotate(13deg) scale(1.25)}
.shot .cap{display:block;font-size:14px;margin-top:4px;min-height:1.4em;color:var(--muted)}
.shot.sel{background:var(--hi);box-shadow:0 0 0 4px var(--blue),0 4px 0 4px rgba(8,6,12,.35)}
.shot.ok .cap{color:var(--good)} .shot.no .cap{color:var(--bad)}
.picked{font-size:15px;color:var(--muted)}

.slots{display:grid;gap:8px;margin-bottom:16px}
.slot{display:grid;grid-template-columns:2em 76px 1fr;gap:10px;align-items:center;min-height:56px;background:#2c2438;padding:6px 12px;border:3px dashed var(--line);border-radius:18px;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.slot canvas{width:76px;height:50px;display:block;border-radius:8px;border:2px solid var(--line);background:#2c2438}
.slot .ph{width:76px;height:50px;border-radius:8px;border:2px dashed #d1d4b1}
.slot .n{color:var(--red)}
.slot.empty{color:#b9a88f;cursor:default}
.slot.right{border:3px solid var(--good);background:#2f3a2c} .slot.wrong{border:3px solid var(--bad);background:#2a2235}
.pool{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pool .btn{display:grid;grid-template-columns:76px 1fr;gap:10px;align-items:center}
.pool canvas{width:76px;height:50px;display:block;border-radius:8px;border:2px solid var(--line)}

.stagebox{background:var(--sky);border:3px solid var(--line);border-radius:24px;padding:16px 14px;margin-bottom:16px;display:grid;gap:14px;justify-items:center}
.stagebox canvas{width:min(100%,300px);aspect-ratio:3/2;display:block;border-radius:16px}
.track{position:relative;height:46px;width:100%;background:#2c2438;border:3px solid var(--line);border-radius:999px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:var(--hi);border-left:3px solid var(--line);border-right:3px solid var(--line)}
.dot{position:absolute;top:7px;width:28px;height:28px;margin-left:-14px;background:var(--red);border:3px solid var(--line);border-radius:50%}
.rounds{display:flex;gap:8px;justify-content:center}
.rounds i{width:22px;height:22px;background:#2c2438;border:3px solid var(--line);border-radius:50%}
.rounds i.hit{background:var(--green)} .rounds i.ok{background:var(--accent)} .rounds i.miss{background:var(--red)}

.sub-screen{background:var(--sky);border:3px solid var(--line);border-radius:24px;padding:16px 12px;margin-bottom:16px;display:grid;gap:12px;justify-items:center}
.sub-screen canvas{width:min(100%,300px);aspect-ratio:3/2;display:block;border-radius:16px}
.subtitle{background:rgba(48,23,16,.85);border-radius:12px;padding:6px 14px;display:flex;flex-wrap:wrap;gap:2px 0;justify-content:center;max-width:100%}

@media (max-width:560px){
  body{font-size:17px}
  .hud{grid-template-columns:auto 1fr;gap:10px}
  .hud-money{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;text-align:left}
  .hud-money b{margin:0}
  .cast canvas{width:150px;height:150px}
  .cast{min-height:150px;padding-inline:14px}

  .acts,.pool{grid-template-columns:1fr}
  .cmp{gap:8px}
  .talisman.big{font-size:26px}
  .dlg-text{font-size:19px}
  .sign{padding-inline:20px}
}

/* ---- 9:16 直式舞台：手機與電腦都固定在 9:16 版面內，內容多時在舞台內捲動 ---- */
:root{--sw:min(100vw,calc(100vh*9/16));--sh:min(100vh,calc(100vw*16/9))}
@supports (height:100dvh){:root{--sw:min(100vw,calc(100dvh*9/16));--sh:min(100dvh,calc(100vw*16/9))}}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;justify-content:center;align-items:center}
.wrap{width:var(--sw);height:var(--sh);max-width:none;margin:0;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;padding-block:12px 64px;-webkit-overflow-scrolling:touch}
#svbox{left:calc(50vw - var(--sw)/2 + 12px)}
#snd{right:calc(50vw - var(--sw)/2 + 12px)}

.title-hero{padding-block:8px;gap:12px}
/* ---- 上方血條欄縮小 ---- */

.bar{height:10px;border-width:2px}
.hud-money{grid-column:auto!important;display:block!important;text-align:right;font-size:11px;line-height:1.2}
.hud-money b{display:block;font-size:16px;margin-top:0}

G.color=function(done){

  const match=()=>Math.max(0,Math.round(100-(Math.abs(b-tb)+Math.abs(w-tw))*1.4));
  function words(){
    const db=b-tb,dw=w-tw;
    if(Math.abs(db)<=8&&Math.abs(dw)<=8)return '剛剛好！牛排金黃，看起來就想吃。';
    if(Math.abs(db)>=Math.abs(dw)){return db<0?'太暗了，像在山洞裡拍的。':'太亮了，像宇宙大爆炸。'}
    return dw>0?'太黃了，像烤焦的牛排。':'太冷了，像在冰箱裡拍的。';
  }
  function draw(){
    app.innerHTML=head()+'<p class="task">把右邊的畫面，調得跟左邊一樣。</p><p class="rule">亮度是明暗，暖度是偏黃還是偏藍。</p>'+
    '<div class="cmp"><figure><canvas id="c1" width="288" height="192" data-k="'+(S.round?'group':'plate')+'" style="filter:'+filt(tb,tw)+'"></canvas><figcaption>要做到的樣子</figcaption></figure><figure><canvas id="c2" width="288" height="192" data-k="'+(S.round?'group':'plate')+'" style="filter:'+filt(b,w)+'"></canvas><figcaption>你的畫面</figcaption></figure></div>'+
    '<div class="sliders"><label>亮度<input type="range" id="sb" min="0" max="100" value="'+b+'"></label><label>暖度<input type="range" id="sw" min="0" max="100" value="'+w+'"></label></div>'+
    (finished?'<div class="match"><span class="lbl">接近度</span><div class="bar"><i id="mb" style="width:'+match()+'%"></i></div><b id="mv">'+match()+'%</b></div>':'<p class="lbl" style="text-align:center">憑感覺調，按「調好了」才知道有多接近。</p>')+
    '<p class="feedback" id="fb">'+msg+'</p><div class="game-tools"><span class="picked"></span><button class="talisman" id="go">'+(finished?'繼續':'調好了')+'</button></div>';
    paint(app);

  }
  draw();
};

  S.praised=S.praised||[];let left=W.filter(x=>S.praised.indexOf(x)<0);if(!left.length){const last=S.praised[S.praised.length-1];S.praised=[];left=W.filter(x=>x!==last);if(!left.length)left=W}let word=rnd(left);S.praised.push(word);if(score>=75&&score<90&&Math.random()<.4)word=rnd(['好開心啊！剪完了！','耶～今天可以早點睡了！','嘿嘿，越剪越順手了！']);else if(score>=60&&score<75)word=rnd(['嗯……還、還不錯啦？','肉吉桑笑得有點僵硬。','這樣……應該可以交差吧？']);else if(score<60)word=rnd(['呃……我們假裝沒看到好嗎？','肉吉桑：……好，下一個。','空氣突然安靜了三秒。','酷比醬默默把臉轉過去。']);
  const d=document.createElement('div');d.id='cheer';d.className='cheer';
  d.innerHTML='<div class="cheer-in"><video id="chv" class="chv" poster="assets/41ac6607f9d7.jpg" playsinline webkit-playsinline preload="auto"><source src="assets/f3a7daa88d01.mp4" type="video/mp4"></video><h2>'+word+'</h2><div class="cheer-score">'+score+'<small>分</small></div><p>'+(sub||'')+'<br>'+cmt(score)+'</p><small>點一下繼續</small></div>';
  document.body.appendChild(d);
  const v=d.querySelector('#chv');let raf;v.muted=!(window.SND&&SND.on!==false&&!(document.getElementById('snd')&&/關/.test(document.getElementById('snd').textContent)));
  try{v.currentTime=0}catch(e){}const pl=v.play();pl&&pl.catch(()=>{v.muted=true;v.play().catch(()=>{})});

function fail(why,c,sc){
  top();const f=FAILS[why];S.fails=(S.fails||0)+1;f.run();hud();

  app.innerHTML='<div class="px result fail"><h2>'+f.h+'</h2>'+(sc!=null?'<div class="score-big bad"><b>'+sc+'</b><small>分</small></div><p class="lbl">限時挑戰要 '+PASS+' 分才能過關。</p>':'')+'<p>'+f.p+'</p><div class="reward">'+f.fx.split('，').map(x=>'<span><i class="ic" data-ic="'+(/時間|截稿/.test(x)?'clock':/精神/.test(x)?'bolt':/血/.test(x)?'drop':'coin')+'"></i>'+x+'</span>').join('')+'</div><p class="lbl">目前第 '+S.day+' 天，截稿第 '+S.deadline+' 天</p><button class="talisman" id="go">重玩這一關</button></div>';

  $('#go').onclick=()=>{hud();startLevel(c)};
}
function result(r){
  top();const c=CH[S.ch];let score=Math.round((r.r1.score+r.r2.score)/2),note='',rescued=false;
  if(S.mind<20&&score>10){score-=10;note='精神太差，手一直抖，扣 10 分。'}
  const miss=(r.r1.emiss||0)+(r.r2.emiss||0);
  const reward=Math.round((60+score*0.9)*(S.items.screen?1.3:1));
  const loss=S.items.chair?6:12,mloss=Math.max(2,Math.min(20,6+3*miss)-(S.items.plant?4:0)),last=S.ch===CH.length-1;
  if(!S.relax&&S.day>S.deadline){fail('time',c);return}
  if(S.mind-mloss<=0){fail('mind',c);return}
  if(!last&&S.blood-loss<=0){if((S.vit||0)>0){S.vit--;rescued=true}else{fail('blood',c);return}}
  S.money+=reward;S.scores.push(score);S.blood=rescued?30:clamp(S.blood-loss);S.mind=clamp(S.mind-mloss);S.day++;
  if(S.items.steakcard){S.mind=clamp(S.mind+15);S.blood=clamp(S.blood+6)}
  if(last)S.blood=Math.min(S.blood,12);
  hud();window.SND&&(SND.music('cute'),SND.stars(score>=90?3:score>=75?2:1));
  cheer(score,'「'+c.name+'」完成！');
  app.innerHTML='<div class="px result"><h2>'+c.name+'完成</h2>'+scoreBox(score)+
  '<p class="lbl">第 1 輪 '+r.r1.score+' 分・第 2 輪 '+r.r2.score+' 分</p>'+
  (note?'<p class="feedback bad">'+note+'</p>':'')+((r.r1.kuai||r.r2.kuai)?'<p class="feedback good">乖乖發功：少算一次失誤。</p>':'')+((r.r1.sc||r.r2.sc)?'<p class="feedback good">殭師父的剪刀：每輪少算一次失誤。</p>':'')+(S.items.steakcard?'<p class="feedback good">牛排吃到飽卡：吃飽了，精神 +15、血色 +6。</p>':'')+
  '<div class="reward"><span><i class="ic" data-ic="coin"></i>報酬 +$'+reward+'</span><span><i class="ic" data-ic="drop"></i>血色 '+(rescued?'回到 30':'-'+(last?'一大截':loss))+'</span><span><i class="ic" data-ic="bolt"></i>精神 -'+mloss+(miss?'（失誤 '+miss+' 次）':'')+'</span></div>'+
  '<div class="tipcard"><h3>'+c.tip[0]+'</h3><p>'+c.tip[1]+'</p></div>'+
  '<button class="talisman" id="go">繼續</button></div>';
  hud();hud(false);if(rescued)vitPop();
  $('#go').onclick=()=>{hud();top();story(c.outro,c.place,()=>{if(last)ending();else studio()})};
}

const sv=box.querySelector('#svb'),rs=box.querySelector('#rst');let tm=0,t2=0;
const sync=()=>{const on=!!window.__phase;sv.disabled=!on;box.classList.toggle('idle',!on);box.classList.toggle('pulse',window.__phase==='studio')};
setInterval(sync,300);sync();
const mv=()=>{const n=document.getElementById('snd');if(n&&n.parentNode!==box)box.appendChild(n)};mv();setTimeout(mv,500);
sv.onclick=()=>{if(!window.__phase)return;saveGame(window.__phase);window.SND&&SND.sfx('good');sv.textContent='已存檔 ✓';clearTimeout(t2);t2=setTimeout(()=>{sv.textContent='存檔'},1800)};
rs.onclick=()=>{if(rs.dataset.arm){clearTimeout(tm);try{location.reload()}catch(e){title()}return}
rs.dataset.arm=1;rs.textContent='從頭開始';tm=setTimeout(()=>{delete rs.dataset.arm;rs.textContent='✕'},3000)};
})();

/* ---- 遊戲後台（測試用）：只在網址加 ?debug 時打開 ---- */
(function(){
  const st=document.createElement('style');st.textContent='#dbg{position:fixed;z-index:200;inset:0;background:rgba(48,23,16,.6);display:none;align-items:center;justify-content:center;padding:10px}#dbg.on{display:flex}#dbg .pn{background:#fcf3e2;border:3px solid #83533f;border-radius:18px;width:min(420px,100%);max-height:92vh;overflow:auto;padding:12px 14px;font-size:14px;line-height:1.4}#dbg h4{margin:10px 0 6px;font-size:15px;color:#a65639}#dbg .rw{display:flex;flex-wrap:wrap;gap:6px}#dbg button{font:inherit;font-size:13px;padding:5px 9px;border:2px solid #83533f;border-radius:10px;background:#fcfaf5;color:#593f38;cursor:pointer}#dbg button:active{background:#faa76b}#dbg .x{float:right}#dbg input{font:inherit;width:4.2em;padding:3px;border:2px solid #83533f;border-radius:8px}';document.head.appendChild(st);
  const box=document.createElement('div');box.id='dbg';document.body.appendChild(box);
  const close=()=>box.classList.remove('on');
  const go=fn=>()=>{close();try{window.__stopGame&&window.__stopGame();window.SND&&SND.music(null);if(window.cancelAnimationFrame){}fn()}catch(e){alert('後台錯誤：'+e.message)}};
  const ensure=()=>{if(!S.scores)S.scores=[];for(let i=0;i<6;i++)if(S.scores[i]==null)S.scores[i]=80;S.name=S.name||'咔咔醬'};
  const lvl=(n,r)=>()=>{ensure();S.ch=n;const c=CH[n];window.__phase='level';top();
    S.scores.length=n;
    if(r===0)startLevel(c);
    else{S._kuai=0;S.round=1;G[c.game](r2=>{scoreOf(r2);result({r1:{score:80,emiss:0},r2})})}};
  function render(){
    let h='<div class="pn"><button class="x" id="dx">關閉 ✕</button><b style="font-size:17px">🛠 遊戲後台</b>';
    h+='<h4>跳到某一關（含劇情）</h4><div class="rw">'+CH.map((c,i)=>'<button data-a="ch" data-n="'+i+'">'+(i+1)+' '+c.name+'</button>').join('')+'</div>';
    h+='<h4>直接玩小遊戲（不看劇情）</h4><div class="rw">'+CH.map((c,i)=>'<button data-a="l0" data-n="'+i+'">'+(i+1)+'-1</button><button data-a="l1" data-n="'+i+'">'+(i+1)+'-2</button>').join('')+'</div>';
    h+='<h4>畫面</h4><div class="rw"><button data-a="studio">工作室</button><button data-a="shop">商店（開）</button><button data-a="end">結局：新影片誕生</button><button data-a="fail">失敗畫面</button><button data-a="toilet">上廁所存檔視窗</button><button data-a="vit">維他命救命</button><button data-a="dex">成就圖鑑</button><button data-a="title">回標題</button></div>';
    h+='<h4>過場動畫</h4><div class="rw">'+Object.keys(ART.cuts).map(k=>'<button data-a="cut" data-n="'+k+'">'+({knock:'肉吉桑敲門',jump:'酷比醬踩鍵盤',sizzle:'帥氣翻牛排',pop:'殭師父嚇人',transform:'變成殭屍',mayor:'局長巡店',kitchen:'走進廚房',toilet:'衝去廁所'}[k]||k)+'</button>').join('')+'</div>';
    h+='<h4>數值</h4><div class="rw">血色 <input id="dh" type="number" value="'+S.blood+'"> 精神 <input id="dm" type="number" value="'+S.mind+'"> 存款 <input id="dy" type="number" value="'+S.money+'"> <button data-a="setv">套用</button></div><div class="rw" style="margin-top:6px"><button data-a="rich">+$1000</button><button data-a="zom">變殭屍(血0)</button><button data-a="full">全滿</button><button data-a="items">買齊商品</button><button data-a="clr">清除存檔</button></div>';
    h+='</div>';box.innerHTML=h;
  }
  function open(){render();box.classList.add('on')}
  box.addEventListener('click',e=>{if(e.target===box){close();return}const b=e.target.closest('button');if(!b)return;
    if(b.id==='dx'){close();return}const a=b.dataset.a,n=+b.dataset.n;
    if(a==='ch')go(()=>{ensure();S.scores.length=n;S.ch=n;chapter()})();
    else if(a==='l0')go(lvl(n,0))();else if(a==='l1')go(lvl(n,1))();
    else if(a==='studio')go(()=>{ensure();window.__phase='studio';renderStudio()})();
    else if(a==='shop')go(()=>{ensure();S.shopOpen=true;S.money=Math.max(S.money,300);window.__phase='studio';renderStudio()})();
    else if(a==='end')go(()=>{ensure();ending()})();
    else if(a==='vit')go(()=>vitPop())();else if(a==='dex')go(()=>showDex())();
    else if(a==='fail')go(()=>{ensure();fail('perf',CH[S.ch||0])})();
    else if(a==='toilet')go(()=>toiletScene(()=>renderStudio()))();
    else if(a==='title')go(()=>title())();
    else if(a==='cut')go(()=>cutscene(b.dataset.n,()=>title()))();
    else if(a==='setv'){S.blood=+$('#dh').value;S.mind=+$('#dm').value;S.money=+$('#dy').value;hud();}
    else if(a==='rich'){S.money+=1000;hud();render()}
    else if(a==='zom'){S.blood=0;hud();render()}
    else if(a==='full'){S.blood=100;S.mind=100;hud();render()}
    else if(a==='items'){Object.keys(S.items).forEach(k=>S.items[k]=true);render()}
    else if(a==='clr'){try{clearSave()}catch(x){}b.textContent='已清除 ✓'}
  });
  window.__debug=open;
  if(/[?&]debug/.test(location.search))setTimeout(open,300);
})();

/* ---- 測試用：截圖複製按鈕（只在網址加 ?debug 時出現） ---- */
(function(){if(!/[?&]debug/.test(location.search))return;const b=document.createElement('button');b.id='shotbtn';b.type='button';b.textContent='📷';b.setAttribute('aria-label','截圖並複製');document.body.appendChild(b);
  const label=()=>{const q=s=>{const e=document.querySelector(s);return e?e.textContent.trim():''};const gh=q('.game-head h2');if(gh)return gh+'・'+q('.game-head .tag');return q('.scene-title span')||q('.shop-top h2')||q('.result h2')||q('.end h2')||(document.querySelector('.title-hero')?'首頁':'畫面')};
  const load=()=>window.html2canvas?Promise.resolve():new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=ok;sc.onerror=no;document.head.appendChild(sc)});
  const show=(url,msg)=>{const d=document.createElement('div');d.className='modal shotpv';d.innerHTML='<div class="px modal-card"><h3>'+msg+'</h3><img src="'+url+'" alt="截圖"><button class="talisman" id="spx">關閉</button></div>';document.body.appendChild(d);d.querySelector('#spx').onclick=()=>d.remove()};
  b.onclick=async()=>{b.disabled=true;b.textContent='…';try{await load();const lb=label();b.style.visibility='hidden';const cv=await html2canvas(document.body,{backgroundColor:'#1c1726',scale:Math.min(2,window.devicePixelRatio||1),width:innerWidth,height:innerHeight,x:scrollX,y:scrollY,logging:false});b.style.visibility='';
    const g=cv.getContext('2d'),sc=cv.width/innerWidth,t=lb+'｜F版';g.font='bold '+Math.round(13*sc)+'px sans-serif';const w=g.measureText(t).width+16*sc;g.fillStyle='rgba(0,0,0,.75)';g.fillRect(0,0,w,24*sc);g.fillStyle='#f2b24c';g.textBaseline='middle';g.fillText(t,8*sc,12*sc);
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));let ok=false;try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);ok=true}catch(e){}
    if(ok){b.textContent='✓';setTimeout(()=>b.textContent='📷',1500)}else{b.textContent='📷';show(URL.createObjectURL(blob),'無法直接複製：長按（或右鍵）圖片，選「拷貝」或「儲存」')}}catch(e){b.style.visibility='';b.textContent='📷';alert('截圖失敗：'+e.message)}b.disabled=false};
})();
ART.ready.then(()=>{const bt=document.getElementById('boot');if(bt){bt.classList.add('out');setTimeout(()=>bt.remove(),400)}intro()});
(function mewLoop(){setTimeout(()=>{try{if(!document.hidden&&window.SND)SND.sfx('mew')}catch(e){}mewLoop()},25000+Math.random()*45000)})();
})();

</script>

<style id="design-spec">
/* ===== 設計規格（統一版，放最後，蓋過前面各版殘留的樣式）=====
   顏色：金 #f2b24c（標題、主按鈕）／青 #5fb8a8（次按鈕）／框線 #b08a5a／面板深紫／文字米白
   外框：所有面板、彈窗都用同一種像素切角框 */
:root{--ds-gold:#f2b24c;--ds-line:#b08a5a;--ds-panel:rgba(28,23,38,.96);--ds-text:#f6ecd6;--ds-sub:#ddcfb2}
/* 彈窗背景：統一深色＋模糊，不再透出後面的畫面 */
.modal,.vitpop{background:rgba(14,11,20,.82)!important;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
/* 彈窗外框：維他命等彈窗改成跟其他面板一樣 */
.vp-in{background:var(--ds-panel)!important;box-shadow:0 5px 0 rgba(8,6,12,.28)!important}
.modal-card{background-color:var(--ds-panel)!important}
/* 標題：全部用金色（原本有些是舊版的磚紅色） */
.modal-card h3,.vp-in h2,.result h2,.end h2,.dex li.got b{color:var(--ds-gold)!important}
.modal-card h3,.vp-in h2{font-size:24px!important}
/* 圖鑑清單：框線跟其他面板同色 */
.dex li{border-color:rgba(176,138,90,.55)!important;color:var(--ds-sub)!important}
.dex li.got{border-color:var(--ds-line)!important;color:var(--ds-text)!important}
/* 彈窗、結果頁裡的主按鈕：同樣的最小寬度 */
.modal-card .talisman,.result>.talisman,.dlg-foot .talisman{min-width:200px}
/* 結果頁（過關、失敗）：拿掉字後面的點點底紋，字比較好讀 */
.result{background-image:none!important}
</style>
