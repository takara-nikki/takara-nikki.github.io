<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe7d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="付喪神">
<title>タカラ付喪神</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Noto+Serif+JP:wght@500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1e9da; --paper2:#e6dcc8; --paper3:#fbf7ef;
  --ink:#3b3632; --ink2:#5d5752; --mute:#8b8278; --line:rgba(93,87,82,.28);
  --shu:#c4432f; --shu2:#a8341f; --lamp:#efa04c;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .2  0 0 0 .32 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --fiber:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .2' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 .22 -.04'/></filter><rect width='100%' height='100%' filter='url(%23f)'/></svg>");
  --paperbg:var(--grain),var(--fiber),linear-gradient(180deg,#f5eee2,#ebe2d0);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:#2a2622;color:var(--ink);font-family:"Noto Serif TC","Noto Serif JP",serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
.jp{font-family:"Noto Serif JP","Hiragino Mincho ProN",serif}
.brush{font-family:"Yuji Syuku","Noto Serif JP",serif;font-weight:400}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cl{display:inline-block;max-width:100%}
kbd{display:none;min-width:17px;padding:1px 5px;border-radius:5px;background:#4a4440;color:#f5eee2;font:600 10.5px/1.35 -apple-system,sans-serif;text-align:center;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
@media (hover:hover) and (pointer:fine){kbd{display:inline-block}}

/* 和紙面板＋墨框 */
.paper{background:var(--paperbg);background-size:200px,400px,auto;color:var(--ink)}
.frame{position:relative;border-radius:22px;box-shadow:0 18px 40px rgba(20,14,8,.4)}
.plum{position:absolute;width:26px;height:26px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));pointer-events:none;z-index:2}
.cloud{position:absolute;pointer-events:none;z-index:2;opacity:.92}

/* 相機 */
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#1c1916}
video.mirror{transform:scaleX(-1)}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}

/* 偵測框（橘色角括） */
.box{position:absolute;left:0;top:0;opacity:0;--c:var(--lamp);transition:transform .32s var(--ease),width .32s var(--ease),height .32s var(--ease),opacity .35s;
  background:
    linear-gradient(var(--c),var(--c)) left top/22px 3px,linear-gradient(var(--c),var(--c)) left top/3px 22px,
    linear-gradient(var(--c),var(--c)) right top/22px 3px,linear-gradient(var(--c),var(--c)) right top/3px 22px,
    linear-gradient(var(--c),var(--c)) left bottom/22px 3px,linear-gradient(var(--c),var(--c)) left bottom/3px 22px,
    linear-gradient(var(--c),var(--c)) right bottom/22px 3px,linear-gradient(var(--c),var(--c)) right bottom/3px 22px;
  background-repeat:no-repeat;border-radius:6px;filter:drop-shadow(0 0 5px rgba(239,160,76,.6))}
.box{display:none}

/* 妖怪＋標籤 */
.yk{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;pointer-events:auto;opacity:0;transition:transform .32s var(--ease),opacity .35s}
.yk.on{opacity:1}
.yk .av{width:42px;height:42px;object-fit:contain;margin:-12px -4px -8px -8px;filter:drop-shadow(0 3px 4px rgba(20,14,8,.35));transform-origin:50% 90%}
.yk .bub{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--shu);color:#fff;font:900 12px/20px "Noto Serif JP",serif;text-align:center;box-shadow:0 3px 6px rgba(0,0,0,.3);animation:pop .5s var(--spring) both}

.yk .lim{position:absolute;z-index:2;top:-10px;left:34px;padding:1px 7px;border-radius:6px;background:var(--shu);color:#fbf1e4;font:700 10px/1.5 "Noto Serif JP",serif;letter-spacing:.08em}
.tag{position:relative;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 12px;border-radius:999px;white-space:nowrap;
  background:rgba(52,47,43,.86);color:#f5eee2;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.tag .k{font-size:19px;font-weight:700;line-height:1}
.tag .sub{display:flex;flex-direction:column;line-height:1.15}
.tag .r{font-size:10.5px;color:#f3c98c;letter-spacing:.05em}
.tag .z{font-size:10.5px;color:rgba(245,238,226,.7)}
.yk:active .tag{transform:scale(.95)}
@keyframes float{50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes pop{from{transform:scale(0)}}
/* 說話中：彈跳＋發光 */
.talking .av{animation:talk .3s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px rgba(255,214,150,.95)) drop-shadow(0 3px 4px rgba(20,14,8,.3))}
.yk.talking .tag{box-shadow:0 0 20px rgba(239,160,76,.7)}
@keyframes talk{from{transform:translateY(0) scale(1,1) rotate(-2deg)}to{transform:translateY(-6px) scale(1.05,.95) rotate(2deg)}}

/* 頂部 */
#top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(env(safe-area-inset-top) + 16px) 18px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 8px;border-radius:16px}
.brand b{font-size:26px;line-height:1;color:var(--ink);letter-spacing:.02em}
.seal{display:grid;place-items:center;width:24px;height:30px;border-radius:4px;background:var(--shu);color:#fbf1e4;font:700 9px/1.05 "Noto Serif JP",serif;writing-mode:vertical-rl;letter-spacing:.05em}
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 14px;border-radius:14px;font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap;
  box-shadow:0 6px 16px rgba(20,14,8,.3);transition:transform .35s var(--spring),box-shadow .3s}
.pbtn:active{transform:scale(.95)}
.pbtn.on{box-shadow:0 0 22px rgba(239,160,76,.65)}
.pbtn.off{color:var(--mute)}
.pbtn.off .wave{opacity:0}
#scene{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 70px);z-index:5;display:flex;gap:4px;padding:4px;border-radius:14px;
  box-shadow:0 6px 16px rgba(20,14,8,.28)}
#scene button{height:30px;padding:0 11px;border-radius:10px;font-size:13px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px;white-space:nowrap;transition:background .3s,color .3s}
#scene button.on{background:var(--ink);color:#f5eee2}
#scene svg.i{width:15px;height:15px}
#scene kbd{align-self:center;margin:0 4px}

/* 幽猫導覽 */
#guide{position:fixed;left:18px;right:18px;bottom:calc(env(safe-area-inset-bottom) + 108px);z-index:5;max-width:440px;margin:0 auto;display:flex;align-items:center;gap:6px;min-height:58px;padding:8px 18px 8px 74px;border-radius:18px;box-shadow:0 10px 24px rgba(20,14,8,.32);transition:transform .4s var(--spring)}
#guide .cat{position:absolute;left:-6px;bottom:-4px;width:76px;filter:drop-shadow(0 4px 6px rgba(20,14,8,.3))}
#guide.say .cat{animation:talk .3s ease-in-out 4 alternate}
#guide.bump{transform:scale(1.03)}
#gTxt{font-size:15px;font-weight:700;line-height:1.45;text-wrap:balance}
#gTxt em{font-style:normal;color:var(--shu)}
@keyframes blink{50%{transform:translateY(3px);opacity:.4}}

/* 底部操作列 */
#ctrl{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:5;display:flex;align-items:center;justify-content:center;gap:26px}
#ctrl .pbtn{width:92px;height:46px;font-size:15px}
#ctrl .pbtn b{color:var(--shu);font-size:13px}
#shut{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#4c4641,#2f2a26);color:#f5eee2;
  box-shadow:0 10px 24px rgba(20,14,8,.45);transition:transform .35s var(--spring)}
#shut svg{width:30px;height:30px}
#shut:active{transform:scale(.9)}
#shut{position:relative}#shut kbd{position:absolute;top:-2px;right:-6px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30;transition:opacity .45s}
#flash.on{opacity:.85;transition:none}

/* 遮罩與面板 */
#scrim{position:fixed;inset:0;z-index:8;background:rgba(30,24,18,.35);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:9;max-width:460px;margin:0 auto;padding:22px 22px 18px;
  transform:translateY(30px) scale(.94);opacity:0;pointer-events:none;transition:transform .45s var(--spring),opacity .25s}
.sheet.on{transform:none;opacity:1;pointer-events:auto}
.x{position:absolute;top:14px;right:14px;z-index:3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);background:rgba(93,87,82,.09)}
.no{display:inline-block;padding:3px 11px;border-radius:999px;background:var(--ink);color:#f5eee2;font:700 11px/1.4 -apple-system,sans-serif;letter-spacing:.06em}
.rule{position:relative;height:1px;margin:14px 0;background:linear-gradient(90deg,transparent,var(--line) 10%,var(--line) 90%,transparent)}

/* 卡片 */
.chead{display:flex;align-items:center;gap:10px;padding-right:40px}
.who{font-size:13px;color:var(--ink2);font-weight:700;white-space:nowrap}
.who small{font-size:11px;color:var(--mute);margin-left:4px;font-weight:500}
.cbody{display:flex;align-items:flex-end;gap:10px;margin-top:6px}
.word{flex:1;min-width:0;padding-bottom:6px}
.word .k{font-size:50px;font-weight:900;line-height:1.05;white-space:nowrap;letter-spacing:.01em}
.word .k.m{font-size:36px}.word .k.l{font-size:28px}.word .k.xl{font-size:24px}
.word .rp{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;background:rgba(93,87,82,.12);color:var(--ink2);font-size:13px;letter-spacing:.06em}
.word .z{display:inline-block;margin-left:8px;font-size:14px;color:var(--mute)}
#cSpr{width:118px;flex:none;margin:-34px -4px -6px 0;filter:drop-shadow(0 10px 12px rgba(20,14,8,.3))}
#card.on #cSpr{animation:popin .6s var(--spring) both}
#card.on.talking #cSpr{animation:talk .3s ease-in-out infinite alternate}
@keyframes popin{from{transform:scale(.3) translateY(30px);opacity:0}}
.quote{font-size:16.5px;line-height:1.7;font-weight:700}
.quote-zh{font-size:13.5px;color:var(--mute);margin-top:4px;line-height:1.6}
.vlabel{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:12px;font-weight:700;color:var(--shu);white-space:nowrap}
.vlabel small{color:var(--mute);font-weight:500;font-size:11.5px}
.vlabel kbd{margin:0 0 0 1px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:9px;min-width:0;text-align:left;padding:8px 10px;border-radius:12px;background:rgba(93,87,82,.08);transition:transform .35s var(--spring),box-shadow .25s}
.chip b{font-size:18px;font-weight:700;white-space:nowrap;line-height:1.15}
.chip b.l{font-size:15px}
.chip .rz{min-width:0;flex:1 1 auto;overflow:hidden;display:flex;flex-direction:column;line-height:1.2}
.chip .rz i{font-style:normal;font-size:10.5px;color:var(--shu2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .rz span{font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:active{transform:scale(.95)}
.chip.say,.wrow.say{background:rgba(239,160,76,.22);box-shadow:0 0 16px rgba(239,160,76,.45)}
.acts{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;margin-top:16px}
.btn{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;transition:transform .35s var(--spring)}
.btn:active{transform:scale(.95)}
.btn.ghost{background:rgba(93,87,82,.1)}
.btn.main{color:#fbf1e4;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0) 50%),linear-gradient(180deg,#cf5038,var(--shu2));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.2),0 8px 18px rgba(168,52,31,.3)}
.btn kbd{margin-left:2px}
.stamp{position:absolute;top:64px;right:118px;width:56px;height:56px;border-radius:12px;border:3px solid var(--shu);color:var(--shu);display:grid;place-items:center;
  font:900 10.5px/1.1 "Noto Serif JP",serif;text-align:center;transform:rotate(-12deg) scale(2.4);opacity:0;mix-blend-mode:multiply;z-index:3}
.stamp span{font-size:22px;display:block}
.stamp.hit{animation:stamp .5s var(--spring) forwards}
@keyframes stamp{60%{opacity:.95;transform:rotate(-12deg) scale(.92)}100%{opacity:.85;transform:rotate(-12deg) scale(1)}}

/* 圖鑑 */
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:44px}
.dtabs{display:flex;gap:6px}
.dtabs button{height:36px;padding:0 13px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--ink2);white-space:nowrap;background:rgba(93,87,82,.08)}
.dtabs button.on{background:var(--ink);color:#f5eee2;box-shadow:none}
.dtabs svg.i{width:17px;height:17px}
.cnt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);font-weight:700;white-space:nowrap}
.cnt img{width:22px}
.filt{display:flex;gap:8px;margin:14px -22px 0;padding:2px 22px 4px;overflow-x:auto;scrollbar-width:none;-webkit-mask:linear-gradient(90deg,transparent,#000 22px,#000 calc(100% - 30px),transparent)}
.filt::-webkit-scrollbar{display:none}
.filt button{flex:none;position:relative;height:42px;min-width:42px;padding:0 4px;border-radius:12px;display:grid;place-items:center;background:rgba(93,87,82,.08);font-size:13px;font-weight:700;color:var(--ink2)}
.filt button.all{padding:0 12px}
.filt button img{width:32px;height:32px;object-fit:contain}
.filt button.on{background:rgba(239,160,76,.3)}
.filt button.on::after{content:"";position:absolute;top:-6px;left:-6px;width:14px;height:14px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><g fill='%23c4432f'><circle cx='12' cy='6' r='4.4'/><circle cx='17.7' cy='10.2' r='4.4'/><circle cx='15.5' cy='17' r='4.4'/><circle cx='8.5' cy='17' r='4.4'/><circle cx='6.3' cy='10.2' r='4.4'/></g><circle cx='12' cy='12' r='2.6' fill='%23f3d9a0'/></svg>") center/contain no-repeat}
.dsub{margin-top:10px;font-size:12.5px;color:var(--mute);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;max-height:44vh;overflow:auto;padding:2px 2px 6px}
.cell{position:relative;aspect-ratio:1/1.08;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:rgba(93,87,82,.07);}
.cell img{width:58%;height:52%;object-fit:contain}
.cell .kk{font-size:clamp(11px,3.6vw,15px);font-weight:700;white-space:nowrap;max-width:92%;overflow:hidden}
.cell small{font-size:10px;color:var(--mute);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.cell.got{background:rgba(251,247,239,.9);box-shadow:0 4px 10px rgba(20,14,8,.12)}
.cell.got:active{transform:scale(.94)}
.cell:not(.got) img{filter:brightness(0);opacity:.16}
.cell .q{position:absolute;top:28%;left:50%;transform:translate(-50%,-50%);font:700 18px/1 -apple-system,sans-serif;color:rgba(93,87,82,.5)}
.wlist{margin-top:10px;max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.wrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;background:rgba(93,87,82,.08);text-align:left;transition:box-shadow .25s}
.wrow b{font-size:19px;white-space:nowrap}
.wrow span{font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow span i{font-style:normal;color:var(--shu2);margin-right:7px}
.wrow img{width:30px}
.empty{padding:30px 0;text-align:center;font-size:13px;color:var(--mute)}

/* 身體模式、翻轉、顏值 */
.tr{display:flex;gap:10px}
#flipBtn{display:none}
body.bodymode #flipBtn{display:inline-flex}
.yk .lim.gold{background:#b5832f;color:#fff8ea}
.yk.rt .tag{background:rgba(60,46,24,.9)}
.yk.rt .k{color:#ffe0a6}
/* 圖鑑固定高度，內容在裡面捲動 */
#dex{height:min(74vh,640px);display:flex;flex-direction:column}
#dex .grid,#dex .wlist{flex:1;min-height:0;max-height:none;align-content:start}

/* 日本限定 */
.no.lim{background:var(--shu)}
.jpb{display:none;align-items:center;padding:0 9px;border-radius:9px;background:var(--shu);color:#fbf1e4;font-size:12px;font-weight:700;white-space:nowrap}
body.japan .jpb{display:flex}
.dtabs button.tjp.on{background:var(--shu)}
.cell.lim::after{content:"限定";position:absolute;top:4px;right:4px;padding:0 4px;border-radius:4px;background:var(--shu);color:#fbf1e4;font-size:9px;line-height:1.5}
@media (max-width:420px){.dhead .cnt{display:none}.dtabs button{padding:0 11px;font-size:14px}}
.qtop{display:flex;align-items:center;gap:12px;margin-top:10px}
#qSpr{width:96px;flex:none;filter:drop-shadow(0 8px 10px rgba(20,14,8,.3))}
#quiz.on #qSpr{animation:popin .6s var(--spring) both}
.qbox{flex:1;min-width:0}
.qp{font-size:14px;color:var(--ink2);font-weight:700}
.qk{margin-top:4px;font-size:40px;font-weight:900;line-height:1.1;white-space:nowrap}
.qk small{display:block;font-size:14px;color:var(--mute);font-weight:500;letter-spacing:.06em;margin-top:2px}
.qplay{margin-top:8px;height:38px;padding:0 14px;border-radius:12px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:700;background:rgba(93,87,82,.1)}
.qopts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.qo{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 14px;border-radius:14px;text-align:left;font-size:18px;font-weight:700;background:rgba(93,87,82,.08);transition:transform .35s var(--spring),box-shadow .25s,opacity .25s}
.qo:active{transform:scale(.97)}
.qo kbd{margin:0}
.qo.ok{background:rgba(239,160,76,.3);box-shadow:0 0 20px rgba(239,160,76,.5)}
.qo.ng{opacity:.35;background:rgba(196,67,47,.15);animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.qmsg{margin-top:12px;font-size:13px;color:var(--mute);text-align:center;font-weight:700}
.qmsg.good{color:#b5651d}.qmsg.bad{color:var(--shu)}
.stamp.goshu{top:auto;bottom:70px;right:26px;width:70px;height:70px;border-radius:50%;font-size:12px}
.stamp.goshu span{font-size:26px}

/* 撮影結果 */
#photo .pv{display:block;width:100%;max-height:56vh;object-fit:contain;border-radius:12px;box-shadow:0 10px 24px rgba(20,14,8,.25);background:#2a2622}
#photo h3{font-size:19px;font-weight:900;margin-bottom:12px}

/* 安全提醒 */
.safe{position:fixed;left:18px;right:18px;top:calc(env(safe-area-inset-top) + 116px);z-index:13;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;
  background:#fbefe6;box-shadow:0 14px 30px rgba(20,14,8,.35);transform:translateY(-14px) scale(.96);opacity:0;pointer-events:none;transition:transform .5s var(--spring),opacity .3s}
.safe.on{opacity:1;transform:none}
.safe svg{width:30px;height:30px;color:var(--shu);flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.safe b{display:block;font-size:16px;font-weight:900;color:var(--shu2);white-space:nowrap}
.safe small{display:block;font-size:12.5px;color:var(--ink2);white-space:nowrap}

/* 開場 */
#start{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;transition:opacity .6s,transform .6s var(--ease)}
#start.out{opacity:0;transform:scale(1.04);pointer-events:none}
.title{position:relative;display:flex;align-items:flex-start;gap:10px}
.title h1{font-size:76px;line-height:1;color:var(--ink);letter-spacing:.04em;text-shadow:0 2px 0 rgba(255,255,255,.4)}
.title .seal{width:30px;height:46px;font-size:12px;margin-top:8px}
.parade{display:flex;align-items:flex-end;justify-content:center;gap:2px;margin:26px 0 8px;height:110px}
.parade img{width:56px;filter:drop-shadow(0 6px 8px rgba(20,14,8,.25));animation:float 3.2s ease-in-out infinite}
.parade img:nth-child(2){width:66px;animation-delay:-.6s}.parade img:nth-child(3){width:80px;animation-delay:-1.2s}.parade img:nth-child(4){width:66px;animation-delay:-1.8s}.parade img:nth-child(5){animation-delay:-2.4s}
#start .lead{font-size:16px;color:var(--ink2);font-weight:700}
#go{margin-top:26px;height:56px;padding:0 28px;border-radius:999px;font-size:16px;font-weight:700;color:#f5eee2;display:flex;align-items:center;gap:10px;background:radial-gradient(circle at 50% 30%,#4c4641,#2f2a26);
  box-shadow:0 14px 30px rgba(20,14,8,.35);transition:transform .35s var(--spring)}
#go:active{transform:scale(.95)}
#go[disabled]{opacity:.75}
#safeNote{margin-top:22px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--shu2);padding:8px 14px;border-radius:999px;background:rgba(196,67,47,.08);white-space:nowrap}
#safeNote svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#note{margin-top:14px;font-size:12px;color:var(--mute)}
#err{margin-top:12px;font-size:13px;color:var(--shu2);min-height:18px;font-weight:700}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

let jaVoice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang));
  jaVoice=vs.find(v=>/Kyoko|O-ren|Otoya|Hattori|Google/i.test(v.name))||vs[0]||null;
}
if("speechSynthesis" in window){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice}
function pitchOf(key){let h=0;for(const c of key)h=(h*31+c.charCodeAt(0))%997;return .8+(h%50)/100}
let talkKey=null;
function setTalking(key){
  document.querySelectorAll(".talking").forEach(el=>el.classList.remove("talking"));
  talkKey=key;
  if(!key)return;
  tags.get(key)?.el.classList.add("talking");
  if(current===key)$("#card").classList.add("talking");
}
function say(text,key){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const list=Array.isArray(text)?text:[text];
  list.forEach((t,i)=>{
    const u=new SpeechSynthesisUtterance(t);
    u.lang="ja-JP"; if(jaVoice)u.voice=jaVoice;
    u.rate=.9; u.pitch=key?pitchOf(GH[key]||key):1;
    u.onstart=()=>setTalking(key);
    if(i===list.length-1)u.onend=u.onerror=()=>{if(talkKey===key)setTalking(null)};
    speechSynthesis.speak(u);
  });
  setTalking(key);
}

let inJapan=false, geoState="off";
const FORCE_JP=/[?&]japan=1/.test(location.search);
function isJapan(la,lo){return (la>=34&&la<=45.6&&lo>=132&&lo<=146)||(la>=30.9&&la<=35.5&&lo>=129.4&&lo<132)||(la>=24&&la<30.9&&lo>=122.9&&lo<=131.5)}
function setJapan(v){
  const was=inJapan;inJapan=v;geoState=v?"jp":"tw";document.body.classList.toggle("japan",v);
  if(v&&!was&&running)guide(`你在日本！<em>日本限定</em>的付喪神出沒中，答對題目才能收服`);

// 附近的地標與神社（網址加 ?near=lm-fuji,shrine 可以測試）
const FORCE_NEAR=(location.search.match(/[?&]near=([^&]+)/)||[])[1]?.split(",").filter(k=>PLACES[k])||[];
let nearPlaces=new Set(FORCE_NEAR), lastShrineQ=null;
function km(a,b,c,d){const r=Math.PI/180,x=(d-b)*r*Math.cos((a+c)/2*r),y=(c-a)*r;return Math.hypot(x,y)*6371}
async function shrineNear(la,lo){
  if(lastShrineQ&&km(la,lo,lastShrineQ.la,lastShrineQ.lo)<.08&&Date.now()-lastShrineQ.t<180000)return lastShrineQ.v;
  try{
    const q=`[out:json][timeout:10];nwr(around:120,${la},${lo})["amenity"="place_of_worship"]["religion"="shinto"];out ids 1;`;
    const j=await (await fetch("https://overpass-api.de/api/interpreter?data="+encodeURIComponent(q))).json();
    const v=(j.elements||[]).length>0;lastShrineQ={la,lo,t:Date.now(),v};return v;
  }catch(e){return lastShrineQ?.v||false}
}
async function onPos(p){
  const la=p.coords.latitude,lo=p.coords.longitude;
  setJapan(isJapan(la,lo));
  if(!inJapan){nearPlaces=new Set(FORCE_NEAR);return}
  const n=new Set(FORCE_NEAR);
  for(const k in PLACES){const pl=PLACES[k];if(pl.lat&&km(la,lo,pl.lat,pl.lon)<=pl.km)n.add(k)}
  if(await shrineNear(la,lo))n.add("shrine");
  for(const k of n)if(!nearPlaces.has(k)&&running)guide(`你在<em>${DATA["jp:"+k].k}</em>附近！它出現在畫面上了`);
  nearPlaces=n;
}
let geoWatch=null;
function checkGeo(){
  if(FORCE_JP)setJapan(true);
  if(!navigator.geolocation||geoWatch!==null)return;
  geoWatch=navigator.geolocation.watchPosition(onPos,()=>{if(!FORCE_JP)geoState="denied"},{maximumAge:60000,timeout:20000});
}

let facing="environment";
async function startCam(f){
  facing=f;

  const touch=matchMedia("(pointer:coarse)").matches;
  mirror = st.facingMode==="user" || (!st.facingMode && (!touch || f==="user"));

}

/* ---------- 身體辨識（MediaPipe，進身體模式才載入） ---------- */
let pose=null, poseLoading=null, rateKey=null, rateLast=0;
async function loadPose(){
  if(pose)return pose;
  if(poseLoading)return poseLoading;
  poseLoading=(async()=>{
    const V="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
    const mp=await import(V+"/vision_bundle.mjs");
    const files=await mp.FilesetResolver.forVisionTasks(V+"/wasm");
    const opt=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:d},runningMode:"VIDEO",numPoses:1});
    try{pose=await mp.PoseLandmarker.createFromOptions(files,opt("GPU"))}catch(e){pose=await mp.PoseLandmarker.createFromOptions(files,opt("CPU"))}
    return pose;
  })();
  try{return await poseLoading}catch(e){poseLoading=null;throw e}
}
function mapPt(x,y){
  const vw=innerWidth,vh=innerHeight,iw=video.videoWidth,ih=video.videoHeight;
  const s=Math.max(vw/iw,vh/ih),ox=(vw-iw*s)/2,oy=(vh-ih*s)/2;
  let X=x*iw*s+ox;const Y=y*ih*s+oy;
  if(mirror)X=vw-X;
  return {X,Y};
}
const PAIR={eye:[2,5],ear:[7,8],shoulder:[11,12],elbow:[13,14],wrist:[15,16],pinky:[17,18],index:[19,20],thumb:[21,22],waist:[23,24],knee:[25,26],ankle:[27,28],heel:[29,30],foot:[31,32]};
function bodyItems(lm){
  const ok=i=>lm[i]&&(lm[i].visibility??1)>.6&&lm[i].x>0&&lm[i].x<1&&lm[i].y>0&&lm[i].y<1;
  const mid=(a,b,t=.5)=>({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
  const side=([l,r])=>{const L=ok(l),Rr=ok(r);if(!L&&!Rr)return null;if(L&&Rr)return (lm[l].visibility??1)>=(lm[r].visibility??1)?l:r;return L?l:r};
  const pts={};
  for(const k in PAIR){const i=side(PAIR[k]);if(i!=null)pts[k]=lm[i]}
  if(ok(0)){pts.nose=lm[0];
    if(ok(2)&&ok(5)){const em=mid(lm[2],lm[5]);pts.head={x:em.x,y:em.y-(lm[0].y-em.y)*3.2}}
    const e=side([7,8]);if(e!=null)pts.face=mid(lm[0],lm[e],.55)}
  if(ok(9)&&ok(10))pts.mouth=mid(lm[9],lm[10]);
  const sh=ok(11)&&ok(12)?mid(lm[11],lm[12]):null, hp=ok(23)&&ok(24)?mid(lm[23],lm[24]):null;
  if(sh&&pts.mouth)pts.neck=mid(pts.mouth,sh,.6);
  if(sh&&hp){pts.chest=mid(sh,hp,.25);pts.belly=mid(sh,hp,.68)}
  {const i=side([11,12]);const j=i===11?13:14;if(i!=null&&ok(j))pts.arm=mid(lm[i],lm[j])}
  {const i=side([15,16]);if(i!=null){const f=i===15?[17,19,21]:[18,20,22];const v=f.filter(ok).map(n=>lm[n]);if(v.length)pts.hand={x:(lm[i].x+v.reduce((a,b)=>a+b.x,0))/(v.length+1),y:(lm[i].y+v.reduce((a,b)=>a+b.y,0))/(v.length+1)}}}
  const cx=innerWidth/2,cy=innerHeight*.45,items=[];
  for(const k in pts){
    if(!DATA["body:"+k])continue;
    const {X,Y}=mapPt(pts[k].x,pts[k].y);
    items.push({key:"body:"+k,X:X-8,Y:Y-8,W:16,H:16,score:1-Math.hypot(X-cx,Y-cy)/Math.hypot(cx,cy)});
  }
  // 顏值判定：看得到臉就判定一次，人離開 3 秒後重新判定
  if(pts.head||pts.nose){
    const now=performance.now();
    if(!rateKey||now-rateLast>3000)rateKey="rate:"+(Math.random()*RATES.length|0);
    rateLast=now;
    const h=pts.head||pts.nose,{X,Y}=mapPt(h.x,h.y);
    items.push({key:rateKey,X:X-8,Y:Y-30,W:16,H:16,score:5,force:true});
  }
  return items;
}

async function loop(){

      }else render(await model.detect(video,15,.55));

}
function mapBox([x,y,w,h]){
  const vw=innerWidth,vh=innerHeight,iw=video.videoWidth,ih=video.videoHeight;
  const s=Math.max(vw/iw,vh/ih),ox=(vw-iw*s)/2,oy=(vh-ih*s)/2;
  let X=x*s+ox,Y=y*s+oy;const W=w*s,H=h*s;
  if(mirror)X=vw-X-W;
  return {X,Y,W,H};
}
function makeTag(key){
  const d=DATA[key];
  const box=document.createElement("div");box.className="box";
  const el=document.createElement("button");el.className="yk";
  const jpx=key.startsWith("jp:");if(jpx)el.classList.add("jpx");
  const rt=isRate(key);if(rt)el.classList.add("rt");
  el.innerHTML=`<span class="tag">${jpx?'<span class="lim">日本限定</span>':rt?'<span class="lim gold">顏值判定</span>':""}<img class="av" src="${avURL(key)}" alt=""><span class="k jp">${d.k}</span><span class="sub"><span class="r jp">${d.r}</span><span class="z">${d.zh}</span></span>${found.has(key)||rt?"":'<span class="bub">!</span>'}</span>`;
  el.addEventListener("click",e=>{e.stopPropagation();if(rt){say(d.ja,key);guide(`<em>${d.k}</em>（${d.zh}）：${d.jz}`)}else openCard(key)});
  $("#labels").append(box,el);
  const o={box,el,last:0};tags.set(key,o);return o;
}
function render(preds){
  const items=[];
  for(const p of preds){ let k=p.class==="person"?"person@"+scene:p.class; if(inJapan&&DATA["jp:"+k])k="jp:"+k; if(!DATA[k])continue; items.push({key:k,...mapBox(p.bbox),score:p.score}) }
  placeItems(items);
}
function placeItems(items){
  const now=performance.now(),best=new Map();
  // 附近的地標、神社：固定浮在畫面上方
  if(scene!=="body") for(const pk of nearPlaces) items.push({key:"jp:"+pk,X:innerWidth/2-8,Y:innerHeight*.3,W:16,H:16,score:9,force:true});
  for(const it of items){const b=best.get(it.key);if(!b||it.score>b.score)best.set(it.key,it)}
  // 穩定過濾：同一個東西要連續被看到 2 次才出現，沒看到就慢慢扣分
  for(const k of best.keys()) streak.set(k,Math.min(4,(streak.get(k)||0)+1));
  for(const k of streak.keys()) if(!best.has(k)) streak.set(k,Math.max(0,streak.get(k)-1));
  const TOP=$("#scene").getBoundingClientRect().bottom+8, BOT=$("#guide").getBoundingClientRect().top-8, placed=[];
  // 一次最多 3 個：已經顯示的優先保留，避免跳來跳去
  const isOn=k=>tags.get(k)?.el.classList.contains("on")?1:0;
  let shown=0;
  for(const [key,p] of [...best].sort((a,b)=>(isOn(b[0])-isOn(a[0]))||(b[1].score-a[1].score))){
    if(!isOn(key) && !p.force && streak.get(key)<2) continue;
    if(shown>=3){tags.get(key)?.el.classList.remove("on");continue}
    shown++;
    const o=tags.get(key)||makeTag(key);
    const {X,Y,W,H}=p;
    o.box.style.transform=`translate(${X}px,${Y}px)`;o.box.style.width=W+"px";o.box.style.height=H+"px";
    const ew=o.el.offsetWidth||150, eh=o.el.offsetHeight||44;
    let tx=X+W/2-ew/2, ty=Y-eh-8;
    if(ty<TOP) ty=Y+10;
    tx=Math.max(20,Math.min(innerWidth-ew-22,tx));
    for(let n=0;n<6;n++){const h=placed.find(r=>tx<r.x+r.w+4&&tx+ew+4>r.x&&ty<r.y+r.h+4&&ty+eh+4>r.y);if(!h)break;ty=h.y+h.h+6}
    ty=Math.max(TOP,Math.min(BOT-eh,ty));placed.push({x:tx,y:ty,w:ew,h:eh});
    o.el.style.transform=`translate(${tx}px,${ty}px)`;
    o.box.classList.add("on");o.el.classList.add("on");o.last=now;lastTouched=key;
    if(!seenSession.has(key)){
      seenSession.add(key);
      const g=GHOSTS[GH[key]];
      if(!current) guide(isRate(key)?`顏值判定：<em>${DATA[key].k}</em>（${DATA[key].zh}）`:isJP(key)&&!found.has(key)?`日本限定 <em>${g.n}</em> 出現！點它挑戰`:found.has(key)?`又見到 <em>${g.n}</em> 了！「${DATA[key].k}」`:`發現了 <em>${g.n}</em>！是「${DATA[key].k}」喔`);
      if(autoSpeak && !current && now-lastAuto>2200){lastAuto=now;say(isRate(key)?DATA[key].ja:DATA[key].r,key)}
    }
  }
  for(const [key,o] of tags){
    if(now-o.last>900){o.box.classList.remove("on");o.el.classList.remove("on");if(isRate(key)&&now-o.last>3000)seenSession.delete(key)}
  }
}

/* ---------- 卡片 ---------- */
function openCard(key){
  if(isJP(key)&&!found.has(key)){openQuiz(key);return}
  const d=DATA[key],g=GHOSTS[GH[key]];current=key;
  $("#cNo").textContent=isJP(key)?"日本限定":"No."+String(KEYS.indexOf(key)+1).padStart(2,"0");
  $("#cNo").classList.toggle("lim",isJP(key));$("#vTxt").textContent=isJP(key)?"N3 單字":"N4 單字";
  $("#cWho").innerHTML=`${g.n}<small>${g.r}</small>`;
  $("#cSpr").src=sprURL(key);
  $("#card").classList.remove("talking");
  $("#cK").textContent=d.k;$("#cK").className="k jp"+(d.k.length>=6?" xl":d.k.length>=5?" l":d.k.length>=3?" m":"");
  $("#cR").textContent=d.r;$("#cZ").textContent=d.zh;
  $("#cQ").innerHTML=d.ja.split(/(?<=[。、！？…])/).map(c=>`<span class="cl">${c}</span>`).join("");
  $("#cQz").textContent=d.jz;
  $("#cW").innerHTML=(WORDS[key]||[]).map((w,i)=>`<button class="chip" data-i="${i}"><b class="jp${w[0].length>=4?" l":""}">${w[0]}</b><span class="rz"><i class="jp">${w[1]}</i><span>${w[2]}</span></span></button>`).join("");
  $("#cW").querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>sayChip(key,+c.dataset.i)));
  const st=$("#stamp");st.classList.remove("hit");
  closeSheet("#dex",true);closeSheet("#photo",true);closeSheet("#quiz",true);
  $("#scrim").classList.add("on");$("#card").classList.add("on");
  if(!found.has(key)){
    found.add(key);saveFound();refreshCount();
    tags.get(key)?.el.querySelector(".bub")?.remove();
    void st.offsetWidth;setTimeout(()=>{st.classList.add("hit");navigator.vibrate?.(30)},300);
    guide(`收服了 <em>${g.n}</em>！單字存進單字本了`);
  }
  say([d.r,d.ja],key);
}
function flash(el){if(!el)return;el.classList.add("say");setTimeout(()=>el.classList.remove("say"),1300)}
function sayChip(key,i){const w=(WORDS[key]||[])[i];if(!w)return;flash($("#cW").children[i]);say(w[1],key)}
function closeSheet(sel,keepScrim){
  $(sel).classList.remove("on");
  if(sel==="#card"){current=null;speechSynthesis?.cancel()}
  if(!keepScrim && !document.querySelector(".sheet.on"))$("#scrim").classList.remove("on");
}
function closeAll(){["#card","#dex","#photo","#quiz"].forEach(s=>closeSheet(s))}
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>closeSheet("#"+b.closest(".sheet").id)));
$("#scrim").addEventListener("click",closeAll);
$("#sayWord").addEventListener("click",()=>current&&say(DATA[current].r,current));
$("#sayLine").addEventListener("click",()=>current&&say(DATA[current].ja,current));

/* ---------- 日本限定題目（三選一） ---------- */
let quiz=null;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function openQuiz(key){
  const d=DATA[key],g=GHOSTS[GH[key]],pool=JKEYS.filter(k=>k!==key);
  const kata=/^[\u30A0-\u30FFー]+$/.test(d.k)||d.k===d.r;
  const types=kata?["mean","listen"]:["read","mean","listen"];
  const type=types[Math.random()*types.length|0];
  const pick=f=>{const v=shuffle([...new Set(pool.map(k=>f(DATA[k])))].filter(x=>x!==f(d)));return shuffle([f(d),v[0],v[1]])};
  let prompt,show="",opts,ans;
  if(type==="read"){prompt="這個字怎麼唸？";show=d.k;ans=d.r;opts=pick(x=>x.r)}
  else if(type==="mean"){prompt="這是什麼意思？";show=`${d.k}<small>${d.r}</small>`;ans=d.zh;opts=pick(x=>x.zh)}
  else{prompt="聽日文，選出正確的字";ans=d.k;opts=pick(x=>x.k)}
  quiz={key,ans,type,done:false};
  $("#qWho").innerHTML=`${g.n}<small>${g.r}</small>`;$("#qSpr").src=sprURL(key);
  $("#qPrompt").textContent=prompt;$("#qK").innerHTML=show;$("#qK").hidden=!show;$("#qPlay").hidden=type!=="listen";
  $("#qMsg").textContent="答對就能收服・答錯可以再試";$("#qMsg").className="qmsg";
  $("#qStamp").classList.remove("hit");
  $("#qOpts").innerHTML=opts.map((o,i)=>`<button class="qo jp" data-v="${o}"><kbd>${i+1}</kbd><span>${o}</span></button>`).join("");
  $("#qOpts").querySelectorAll(".qo").forEach(b=>b.addEventListener("click",()=>answer(b)));
  closeSheet("#card",true);closeSheet("#dex",true);closeSheet("#photo",true);
  $("#scrim").classList.add("on");$("#quiz").classList.add("on");
  if(type==="listen")setTimeout(()=>say(d.r,key),450);
}
function answer(b){
  if(!quiz||quiz.done||b.disabled)return;
  if(b.dataset.v===quiz.ans){
    quiz.done=true;b.classList.add("ok");const key=quiz.key,g=GHOSTS[GH[key]];
    found.add(key);saveFound();refreshCount();tags.get(key)?.el.querySelector(".bub")?.remove();
    $("#qMsg").textContent="答對了！收服日本限定";$("#qMsg").className="qmsg good";
    const st=$("#qStamp");void st.offsetWidth;st.classList.add("hit");navigator.vibrate?.([30,40,60]);
    say(DATA[key].r,key);guide(`收服了日本限定的 <em>${g.n}</em>！`);
    setTimeout(()=>{if($("#quiz").classList.contains("on"))openCard(key)},1500);
  }else{
    b.disabled=true;b.classList.add("ng");navigator.vibrate?.(80);
    $("#qMsg").textContent="不對喔，再試一次";$("#qMsg").className="qmsg bad";
  }
}
$("#qPlay").addEventListener("click",()=>quiz&&say(DATA[quiz.key].r,quiz.key));

/* ---------- 圖鑑 / 單字本 ---------- */
let dexTab="yo", dexFilt="all";
$("#filt").innerHTML=`<button class="all" data-g="all">全部</button>`+Object.keys(GROUP).map(g=>`<button data-g="${g}" title="${GHOSTS[g].n}"><img src="ghosts/${g}-s.webp" alt="${GHOSTS[g].n}"></button>`).join("");
$("#filt").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{dexFilt=b.dataset.g;openDex()}));
function openDex(tab){
  closeSheet("#card",true);closeSheet("#photo",true);
  if(tab)dexTab=tab;
  document.querySelectorAll(".dtabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===dexTab));
  document.querySelectorAll("#filt button").forEach(b=>b.classList.toggle("on",b.dataset.g===dexFilt));
  const base=dexTab==="jp"?JKEYS:dexTab==="wd"?[...KEYS,...JKEYS]:KEYS;
  const keys=base.filter(k=>dexFilt==="all"||GH[k]===dexFilt);
  const isYo=dexTab!=="wd";
  $("#grid").hidden=!isYo;$("#wlist").hidden=isYo;
  const g=GHOSTS[dexFilt];
  if(dexTab==="jp"){
    const got=keys.filter(k=>found.has(k)).length;
    $("#dexCnt").textContent=`${found.size} / ${KEYS.length+JKEYS.length}`;
    $("#dsub").textContent=({jp:"你在日本！掃到這些東西就能挑戰",tw:"目前不在日本・到日本才會出現",denied:"沒有開啟定位・允許定位才能解鎖",off:"開始掃描後會判斷位置"})[geoState]+`（${got}/${keys.length}）`;
    $("#grid").innerHTML=keys.map(k=>found.has(k)
      ?`<button class="cell got lim" data-k="${k}"><img src="${sprURL(k)}" alt=""><span class="kk jp">${DATA[k].k}</span><small>${DATA[k].zh}</small></button>`
      :`<div class="cell"><img src="${sprURL(k)}" alt=""><span class="q">?</span><span class="kk" style="color:rgba(93,87,82,.35)">？</span><small>${DATA[k].zh}</small></div>`).join("");
    $("#grid").querySelectorAll(".got").forEach(c=>c.addEventListener("click",()=>openCard(c.dataset.k)));
  }else if(isYo){
    const got=keys.filter(k=>found.has(k)).length;
    $("#dexCnt").textContent=`${found.size} / ${KEYS.length}`;
    $("#dsub").textContent=g?`${g.n}（${g.r}）收服 ${got} / ${keys.length}`:`全部的付喪神・收服 ${got} / ${keys.length}`;
    $("#grid").innerHTML=keys.map(k=>found.has(k)
      ?`<button class="cell got" data-k="${k}"><img src="${sprURL(k)}" alt=""><span class="kk jp">${DATA[k].k}</span><small>${DATA[k].zh}</small></button>`
      :`<div class="cell"><img src="${sprURL(k)}" alt=""><span class="q">?</span><span class="kk" style="color:rgba(93,87,82,.35)">？</span><small>${DATA[k].zh}</small></div>`).join("");
    $("#grid").querySelectorAll(".got").forEach(c=>c.addEventListener("click",()=>openCard(c.dataset.k)));
  }else renderWords(keys,g);
  $("#scrim").classList.add("on");$("#dex").classList.add("on");
}
function renderWords(keys,g){
  const book=new Map();
  for(const k of keys){if(!found.has(k))continue;for(const w of WORDS[k]||[])if(!book.has(w[0]))book.set(w[0],{w,k})}
  const total=new Set(keys.flatMap(k=>(WORDS[k]||[]).map(w=>w[0]))).size;
  $("#dexCnt").textContent=`${found.size} / ${KEYS.length}`;
  $("#dsub").textContent=`${g?g.n+"的":"已收集的"}單字 ${book.size} / ${total}`;
  if(!book.size){$("#wlist").innerHTML='<div class="empty">還沒收服付喪神，去四周掃一掃吧</div>';return}
  $("#wlist").innerHTML=[...book.values()].map(({w,k})=>`<button class="wrow" data-k="${k}" data-r="${w[1]}"><b class="jp">${w[0]}</b><span><i class="jp">${w[1]}</i>${w[2]}</span><img src="${sprURL(k)}" alt=""></button>`).join("");
  $("#wlist").querySelectorAll(".wrow").forEach(r=>r.addEventListener("click",()=>{flash(r);say(r.dataset.r,r.dataset.k)}));
}
document.querySelectorAll(".dtabs button").forEach(b=>b.addEventListener("click",()=>openDex(b.dataset.tab)));
$("#dexBtn").addEventListener("click",()=>openDex("yo"));
$("#bookBtn").addEventListener("click",()=>openDex("wd"));
$("#autoBtn").addEventListener("click",toggleAuto);
$("#flipBtn").addEventListener("click",flipCam);
function toggleAuto(){autoSpeak=!autoSpeak;try{localStorage.setItem("tsukumo-auto",autoSpeak?"1":"0")}catch(e){}refreshAuto();guide(autoSpeak?"新發現的單字，我會自動唸出來":"好，先安靜不唸了")}

/* ---------- 撮影 ---------- */
let photoBlob=null, photoURL=null;
const imgCache={};
function loadImg(src){return imgCache[src]||(imgCache[src]=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src}))}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
async function takePhoto(){
  if(!running||!video.videoWidth)return;
  const f=$("#flash");f.classList.add("on");requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove("on")));
  const dpr=Math.min(3,devicePixelRatio||2),W=innerWidth,H=innerHeight;
  const cv=document.createElement("canvas");cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext("2d");c.scale(dpr,dpr);
  const iw=video.videoWidth,ih=video.videoHeight,s=Math.max(W/iw,H/ih);
  c.save();if(mirror){c.translate(W,0);c.scale(-1,1)}c.drawImage(video,(W-iw*s)/2,(H-ih*s)/2,iw*s,ih*s);c.restore();
  for(const [key,o] of tags){
    if(!o.el.classList.contains("on"))continue;
    const tg=o.el.querySelector(".tag").getBoundingClientRect(),av=o.el.querySelector(".av").getBoundingClientRect(),kr=o.el.querySelector(".k").getBoundingClientRect();
    c.fillStyle="rgba(52,47,43,.88)";rr(c,tg.x,tg.y,tg.width,tg.height,tg.height/2);c.fill();
        const im=await loadImg(avURL(key));
    if(im){c.save();c.shadowColor="rgba(20,14,8,.35)";c.shadowBlur=5;c.shadowOffsetY=3;c.drawImage(im,av.x,av.y,av.width,av.height);c.restore()}
    const d=DATA[key];c.textBaseline="middle";
    c.fillStyle="#f5eee2";c.font='700 19px "Noto Serif JP",serif';c.fillText(d.k,kr.x,tg.y+tg.height/2);
    const sx=kr.right+8;
    c.font='500 10.5px "Noto Serif JP",serif';c.fillStyle="#f3c98c";c.fillText(d.r,sx,tg.y+tg.height/2-6);
    c.fillStyle="rgba(245,238,226,.75)";c.fillText(d.zh,sx,tg.y+tg.height/2+7);
  }
  // 浮水印
  c.fillStyle="rgba(241,233,218,.92)";rr(c,W-148,H-58,132,40,12);c.fill();
  c.fillStyle="#3b3632";c.font='26px "Yuji Syuku","Noto Serif JP",serif';c.textBaseline="middle";c.fillText("付喪神",W-138,H-37);
  c.fillStyle="#c4432f";rr(c,W-50,H-52,22,28,3);c.fill();
  c.fillStyle="#fbf1e4";c.font='700 8px "Noto Serif JP",serif';["タ","カ","ラ"].forEach((t,i)=>c.fillText(t,W-43,H-45+i*8.5));
  cv.toBlob(b=>{
    photoBlob=b;if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(b);$("#pv").src=photoURL;
    closeSheet("#card",true);closeSheet("#dex",true);$("#scrim").classList.add("on");$("#photo").classList.add("on");
  },"image/jpeg",.92);
}
$("#shut").addEventListener("click",takePhoto);
$("#saveBtn").addEventListener("click",async()=>{
  if(!photoBlob)return;
  const name=`tsukumogami-${new Date().toISOString().slice(0,19).replace(/[-:T]/g,"")}.jpg`;
  const file=new File([photoBlob],name,{type:"image/jpeg"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"タカラ付喪神"});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=photoURL;a.download=name;a.click();
});

/* ---------- 場景 ---------- */
async function setScene(sc,quiet){
  const prev=scene;scene=sc;try{localStorage.setItem("tsukumo-scene",sc)}catch(e){}
  document.querySelectorAll("#scene button").forEach(b=>b.classList.toggle("on",b.dataset.s===sc));
  document.body.classList.toggle("bodymode",sc==="body");
  for(const [k,o] of tags){o.el.classList.remove("on");o.box.classList.remove("on")}
  if(sc==="body"){
    if(!quiet)guide("身體模式：鏡頭對準哪裡，就學哪個部位！");
    if(running&&facing!=="user")try{await startCam("user")}catch(e){}
    if(running&&!pose){guide("喚醒身體付喪神中…");try{await loadPose();guide("準備好了！對準手、臉、肩膀看看")}catch(e){guide("身體辨識載入失敗，請確認網路後再試一次")}}
    return;
  }
  if(prev==="body"&&running&&facing!=="environment")try{await startCam("environment")}catch(e){}
  if(!quiet){guide(`換到${SCENE_ZH[sc]}了，人會變成「<em>${DATA["person@"+sc].k}</em>」`);if(sc==="street")setTimeout(safety,900)}
}
document.querySelectorAll("#scene button").forEach(b=>b.addEventListener("click",()=>setScene(b.dataset.s)));
setScene(scene,true);
function cycleScene(){const a=["home","shop","street","body"];setScene(a[(a.indexOf(scene)+1)%3])}

/* ---------- 走路安全提醒：每 3 分鐘一次 ---------- */
let safeT;
function safety(){
  if(!running)return;
  const el=$("#safe");el.classList.add("on");navigator.vibrate?.([40,60,40]);
  if(autoSpeak&&!current)say("歩きスマホは危ないよ！");
  clearTimeout(safeT);safeT=setTimeout(()=>el.classList.remove("on"),5000);
}
setInterval(()=>{if(running&&!document.hidden)safety()},180000);

/* ---------- 快捷鍵 ---------- */
addEventListener("keydown",e=>{
  if(!$("#start").classList.contains("out"))return;
  const k=e.key.toLowerCase();
  if($("#quiz").classList.contains("on")){
    if(/^[1-3]$/.test(k))answer($("#qOpts").children[+k-1]);
    else if(k==="r"&&quiz)say(DATA[quiz.key].r,quiz.key);
    else if(k==="escape")closeAll();
    return;
  }
  if(e.code==="Space"){e.preventDefault(); if(current)say(DATA[current].ja,current); else if(lastTouched&&tags.get(lastTouched)?.el.classList.contains("on"))openCard(lastTouched)}
  else if(k==="w"&&current)say(DATA[current].r,current);
  else if(/^[1-5]$/.test(k)&&current)sayChip(current,+k-1);
  else if(k==="a")toggleAuto();
  else if(k==="s")cycleScene();
  else if(k==="f")flipCam();
  else if(k==="p")takePhoto();
  else if(k==="b")($("#dex").classList.contains("on")&&dexTab==="yo"?closeSheet("#dex"):openDex("yo"));
  else if(k==="v")($("#dex").classList.contains("on")&&dexTab==="wd"?closeSheet("#dex"):openDex("wd"));
  else if(k==="escape")closeAll();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden)speechSynthesis?.cancel()});
</script>
